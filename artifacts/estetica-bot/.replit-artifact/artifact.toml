kind = "web"
previewPath = "/"
title = "NOVA SKIN MED"
description = "Panel privado de recepción de Nova Skin Med para conversaciones, citas, tratamientos y WhatsApp."
version = "1.0.0"
id = "artifacts/estetica-bot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23006

[services.development]
run = "pnpm --filter @workspace/estetica-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/estetica-bot", "run", "build" ]
serve = "static"
publicDir = "artifacts/estetica-bot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23006"
BASE_PATH = "/"
